##### libraries #####
[libraries]
## project level dependencies
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "android-buildTools" }
google-services = { module = "com.google.gms:google-services", version.ref = "google-services" }
firebse-crashlytics = { module = "com.google.firebase:firebase-crashlytics-gradle", version.ref = "firebse-crashlytics" }
hilt-plugin = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hilt" }

## app level dependencies
# android
android-appcompact = { module = "androidx.appcompat:appcompat", version.ref = "android-appcompact" }
material = { module = "com.google.android.material:material", version.ref = "material" }
multidex = { module = "androidx.multidex:multidex", version.ref = "multidex" }
constraintLayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintLayout" }
viewPager = { module = "androidx.viewpager2:viewpager2", version.ref = "viewPager" }
fragment = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
viewModel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "viewModel" }
lifecycle = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }

data-local = { module = "androidx.datastore:datastore-preferences", version.ref = "data-local" }

# security
security-core = { module = "androidx.security:security-crypto", version.ref = "security-core" }
security-db = { module = "net.zetetic:android-database-sqlcipher", version.ref = "security-db" }

# kotlin
kotlin-jdk = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk7", version.ref = "kotlin" }
coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# play services
maps = { module = "com.google.android.gms:play-services-maps", version.ref = "maps" }
location = { module = "com.google.android.gms:play-services-location", version.ref = "location" }

# firebase
messaging = { module = "com.google.firebase:firebase-messaging", version.ref = "messaging" }
analytics = { module = "com.google.firebase:firebase-analytics-ktx", version.ref = "analytics" }
crashlytics = { module = "com.google.firebase:firebase-crashlytics", version.ref = "crashlytics" }

# image
image-loading = { module = "io.coil-kt:coil", version.ref = "image-loading" }
compression = { module = "id.zelory:compressor", version.ref = "compression" }
image-picker = { module = "com.github.jkwiecien:EasyImage", version.ref = "image-picker" }

# retrofit
retrofit-core = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit-core" }
retrofit-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "retrofit-interceptor" }
retrofit-convertor = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit-convertor" }

# room
room-core = { module = "androidx.room:room-ktx", version.ref = "room-core" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room-core" }

# di
hilt-core = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }

# util
permission = { module = "com.github.smokelaboratory:freedom", version.ref = "permission" }
recyclerView-divider = { module = "com.github.fondesa:recycler-view-divider", version.ref = "recyclerView-divider" }

# testing
junit = { module = "junit:junit", version.ref = "junit" }
android-junit = { module = "androidx.test.ext:junit", version.ref = "android-junit" }
testing-android-core = { module = "androidx.arch.core:core-testing", version.ref = "testing-android-core" }
mockito = { module = "org.mockito:mockito-core", version.ref = "mockito" }
testing-room = { module = "androidx.room:room-testing", version.ref = "room-core" }
hamcrest = { module = "org.hamcrest:hamcrest-integration", version.ref = "hamcrest" }
mock-server = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "mock-server" }
okhttp-idling-resources = { module = "com.jakewharton.espresso:okhttp3-idling-resource", version.ref = "okhttp-idling-resources" }
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }
espresso = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
testing-shared-preferences = { module = "com.github.IvanShafran:shared-preferences-mock", version.ref = "testing-shared-preferences" }

##### bundles #####
[bundles]
android = ["android-appcompact", "material", "multidex", "constraintLayout", "viewPager", "fragment", "viewModel", "lifecycle"]
kotlin = ["kotlin-jdk", "coroutines", "serialization"]
playServices = ["maps", "location"]
firebase = ["messaging", "analytics", "crashlytics"]
image = ["image-loading", "compression", "image-picker"]
security = ["security-core", "security-db"]
retrofit = ["retrofit-core", "retrofit-interceptor", "retrofit-convertor"]
testing-core = ["junit", "mockito", "testing-shared-preferences"]
testing-android = ["testing-room", "android-junit", "testing-android-core", "hamcrest", "espresso", "mock-server", "okhttp-idling-resources"]
